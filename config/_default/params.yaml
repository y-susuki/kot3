hugoblox:
  schema: "2.0"
  identity:
    name: "KOT3"
    organization: "Kyoto University"
    type: organization
    tagline: "Koopman Operator Theory · Kyoto 2026"
    description: "The third international workshop on Koopman Operator Theory, December 11–13, 2026 at Kyoto University."
  theme:
    mode: light
    pack: default
    colors:
      primary: "#4c234a"
      secondary: "#c83c30"
      neutral: stone
    surfaces:
      background: "#ffffff"
      foreground: "#493d47"
      header:
        background: "#faf7f9"
        foreground: "#4c234a"
      footer:
        background: "#ffffff"
        foreground: "#493d47"
  typography:
    pack: academic
  layout:
    radius: md
    spacing: spacious
    avatar_shape: circle
  header:
    enable: true
    style: navbar
    logo: logo/logo_004.png
    show_title: false
    sticky: true
    align: center
    search: false
    theme_toggle: false
    theme_picker: false
    language_switcher: false
  footer:
    style: minimal
    language_switcher: false
    text: "Koopman Operator Theory: Fundamentals, Approximations and Applications 3 · Kyoto, Japan"
  copyright:
    notice: "© {year} KOT3 Organizing Committee"
    license:
      type: custom
      allow_derivatives: false
      share_alike: false
      allow_commercial: false
  content:
    math:
      enable: true
    toc:
      enable: false
    reading_time:
      enable: false
  search:
    enable: false
